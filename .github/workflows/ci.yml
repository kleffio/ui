name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exports
        run: |
          node --input-type=module - <<'SCRIPT'
          import { readFileSync, existsSync } from "fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const targets = Object.values(pkg.exports ?? {});
          const missing = targets.filter(p => !existsSync(p.replace(/^\.\//, "")));
          if (missing.length) { console.error("Missing export targets:", missing); process.exit(1); }
          console.log(`All ${targets.length} export targets present.`);
          SCRIPT
