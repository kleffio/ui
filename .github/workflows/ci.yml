name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exports
        run: node --input-type=module <<'EOF'
          import { readFileSync } from "fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const exports = Object.values(pkg.exports ?? {});
          const { existsSync } = await import("fs");
          const missing = exports.filter(p => !existsSync(p.replace(/^\.\//, "")));
          if (missing.length) { console.error("Missing export targets:", missing); process.exit(1); }
          console.log(`All ${exports.length} export targets present.`);
        EOF
